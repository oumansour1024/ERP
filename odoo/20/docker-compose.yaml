version: '3.8'

services:
  odoo-db:
    image: ${POSTGRES_IMAGE}
    container_name: odoo-20-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER} 
    volumes:
      - odoo-20-db-data:/var/lib/postgresql/data
    restart: always

  odoo:
    image: ${ODOO_IMAGE}
    container_name: odoo-20
    depends_on:
      - odoo-db
    ports:
      - "8069:8069"
    environment:
      - HOST=odoo-20-db
      - USER=${DB_USER}
      - PASSWORD=${DB_PASSWORD}
    volumes:
      - odoo-20-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    restart: always

volumes:
  odoo-20-db-data:
  odoo-20-web-data:
